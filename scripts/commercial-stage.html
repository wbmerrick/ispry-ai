<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts.css">
<style>
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #07080C;
    color: #F4F2EB;
  }
  * { box-sizing: border-box; }
  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #07080C;
  }
  /* Homepage hero. The photo pushes in; the ink wash stays locked so type and room parallax. */
  #hero {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #07080C;
  }
  #hero-photo {
    position: absolute;
    left: -8%;
    top: -8%;
    width: 116%;
    height: 116%;
    object-fit: cover;
    object-position: center 46%;
    transform-origin: 50% 40%;
    will-change: transform;
  }
  /* Same ink wash as .hero-bg::after on the homepage, eased just enough that the dusk room still reads behind the cards. */
  #wash {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 58% 50% at 50% 42%, rgba(7,8,12,.50) 0%, rgba(7,8,12,.32) 48%, rgba(7,8,12,.08) 74%, rgba(7,8,12,0) 84%),
      linear-gradient(180deg, rgba(7,8,12,.55) 0%, rgba(7,8,12,.22) 16%, rgba(7,8,12,.14) 40%, rgba(7,8,12,.28) 68%, rgba(7,8,12,.62) 90%, rgba(7,8,12,.78) 100%);
    pointer-events: none;
  }
  .bug {
    position: absolute;
    top: 64px;
    left: 72px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .bug-word {
    font: 800 44px/1 "Bricolage Grotesque", system-ui, sans-serif;
    letter-spacing: -0.03em;
    color: #F4F2EB;
  }
  .lime { color: #D7FF3F; }
  .mark {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: #D7FF3F;
    color: #07080C;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { display: block; width: 28px; height: 28px; }
  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding: 0 96px 78px;
  }
  #scene-end { align-items: center; padding-bottom: 0; }
  .card {
    position: relative;
    width: 1120px;
    padding: 40px 56px 44px 60px;
    background: rgba(14, 18, 26, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.48);
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 32px;
    bottom: 32px;
    width: 6px;
    border-radius: 0 4px 4px 0;
    background: #D7FF3F;
  }
  .kicker {
    margin: 0 0 16px;
    font: 500 28px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #D7FF3F;
  }
  h1, .brand {
    margin: 0;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.92;
    color: #F4F2EB;
  }
  h1 { font-size: 104px; }
  .sub {
    margin: 18px 0 0;
    font: 500 40px/1.25 "IBM Plex Sans", system-ui, sans-serif;
    color: #C9CEDA;
  }
  .prices {
    display: flex;
    align-items: flex-end;
    gap: 36px;
  }
  .num {
    font: 800 148px/0.86 "Bricolage Grotesque", system-ui, sans-serif;
    letter-spacing: -0.05em;
    color: #D7FF3F;
  }
  .usd {
    font-size: 0.42em;
    letter-spacing: 0;
    margin-right: 4px;
    vertical-align: 0.85em;
  }
  .prices .label {
    margin-top: 8px;
    font: 600 36px/1.2 "IBM Plex Sans", system-ui, sans-serif;
    color: #F4F2EB;
  }
  .or {
    align-self: center;
    margin-bottom: 28px;
    font: 500 28px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #A3AABB;
  }
  .lead-line {
    margin: 0;
    font: 600 44px/1.2 "IBM Plex Sans", system-ui, sans-serif;
    color: #F4F2EB;
  }
  .big {
    margin: 6px 0 0;
    font: 800 176px/0.84 "Bricolage Grotesque", system-ui, sans-serif;
    letter-spacing: -0.055em;
    color: #D7FF3F;
  }
  .end-card {
    width: 1040px;
    padding: 48px 64px 52px;
    text-align: center;
  }
  .end-card::before {
    left: 64px;
    right: 64px;
    top: 0;
    bottom: auto;
    width: auto;
    height: 6px;
    border-radius: 0 0 4px 4px;
  }
  .end-mark {
    width: 84px;
    height: 84px;
    border-radius: 24px;
    margin: 0 auto 18px;
  }
  .end-mark svg { width: 44px; height: 44px; }
  .brand { font-size: 120px; }
  .end-meta {
    margin: 18px 0 0;
    font: 600 40px/1.2 "IBM Plex Sans", system-ui, sans-serif;
    color: #F4F2EB;
  }
  .end-review {
    margin: 12px 0 0;
    font: 500 28px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #D7FF3F;
  }
  .end-911 {
    margin: 22px 0 0;
    font: 600 40px/1.3 "IBM Plex Sans", system-ui, sans-serif;
    color: #F4F2EB;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="hero" aria-hidden="true">
    <img id="hero-photo" alt="" src="/media/hero-1920.jpg" width="1920" height="1080">
  </div>
  <div id="wash" aria-hidden="true"></div>
  <div class="bug" id="bug">
    <span class="mark" id="bug-mark"></span>
    <span class="bug-word">iSpry<span class="lime">.ai</span></span>
  </div>

  <section class="scene" id="scene-hook">
    <div class="card" id="hook-card">
      <p class="kicker" id="hook-kicker">iSpry.ai</p>
      <h1 id="hook-title">Skip the<br>waiting room<span class="lime">.</span></h1>
    </div>
  </section>

  <section class="scene" id="scene-spry">
    <div class="card" id="spry-card">
      <p class="kicker" id="spry-kicker">Free Spry chat</p>
      <h1 id="spry-title">A summary for<br>your physician<span class="lime">.</span></h1>
    </div>
  </section>

  <section class="scene" id="scene-price">
    <div class="card" id="price-card">
      <p class="kicker" id="price-kicker">Cash pay</p>
      <div class="prices">
        <div id="price-visit">
          <div class="num"><span class="usd">$</span>49</div>
          <div class="label">a visit</div>
        </div>
        <div class="or" id="price-or">or</div>
        <div id="price-month">
          <div class="num"><span class="usd">$</span>100</div>
          <div class="label">a month</div>
        </div>
      </div>
    </div>
  </section>

  <section class="scene" id="scene-doctor">
    <div class="card" id="doctor-card">
      <p class="kicker" id="doctor-kicker">Your iSpry physician</p>
      <p class="lead-line" id="doctor-line">Reviews every request</p>
      <div class="big" id="doctor-big">24/7</div>
    </div>
  </section>

  <section class="scene" id="scene-end">
    <div class="card end-card" id="end-card">
      <div class="mark end-mark" id="end-logo"></div>
      <div class="brand" id="end-word">iSpry<span class="lime">.ai</span></div>
      <p class="end-meta" id="end-price"><span class="lime">$49</span> a visit · <span class="lime">$100</span> a month</p>
      <p class="end-review" id="end-review">Reviewed 24/7</p>
      <p class="end-911" id="end-911">In an emergency, call 911.</p>
    </div>
  </section>
</div>
<script>
const FILM = /*__FILM__*/;
const MARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>';

function clamp(x) { return Math.max(0, Math.min(1, x)); }
function ease(p) { p = clamp(p); return 1 - Math.pow(1 - p, 3); }
function smooth(p) { p = clamp(p); return p * p * (3 - 2 * p); }

const FADE = 0.05;
const scenes = FILM.scenes;

function opacityFor(scene, t, i) {
  const a = scene.start;
  const b = a + scene.duration;
  const fadeIn = i === 0 ? 0.08 : FADE;
  const fadeOut = i === scenes.length - 1 ? 0 : FADE;
  if (t < a || t >= b) return 0;
  let o = 1;
  if (t < a + fadeIn) o = (t - a) / fadeIn;
  if (fadeOut && t > b - fadeOut) o = Math.min(o, (b - t) / fadeOut);
  return clamp(o);
}

function enter(el, local, delay, dur) {
  if (!el) return;
  const p = ease((local - delay) / dur);
  el.style.opacity = String(p);
  el.style.transform = "translateY(" + ((1 - p) * 18).toFixed(2) + "px)";
}

function moveHero(t) {
  const total = Math.max(1, Number(FILM.total) || 15);
  const s = smooth(t / total);
  const scale = 1.03 + 0.09 * s;
  const x = -34 * s;
  const y = 14 - 46 * s;
  document.getElementById("hero-photo").style.transform =
    "translate(" + x.toFixed(2) + "px, " + y.toFixed(2) + "px) scale(" + scale.toFixed(4) + ")";
}

async function prepare() {
  document.querySelectorAll(".mark").forEach((el) => { el.innerHTML = MARK; });
  const img = document.getElementById("hero-photo");
  if (!img.complete || !img.naturalWidth) {
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error("Hero image failed to load"));
    });
  }
  if (img.naturalWidth < 1600) throw new Error("Hero image is smaller than expected");
  await document.fonts.ready;
  if (!document.fonts.check("800 104px 'Bricolage Grotesque'")) {
    throw new Error("Bricolage Grotesque did not load");
  }
  if (!document.fonts.check("500 28px 'IBM Plex Mono'")) {
    throw new Error("IBM Plex Mono did not load");
  }
  return true;
}

function renderFrame(t) {
  moveHero(t);
  let endOpacity = 0;
  scenes.forEach((scene, i) => {
    const el = document.getElementById("scene-" + scene.id);
    if (!el) return;
    const o = opacityFor(scene, t, i);
    el.style.opacity = String(o);
    el.style.visibility = o > 0.004 ? "visible" : "hidden";
    if (scene.id === "end") endOpacity = o;
  });
  document.getElementById("bug").style.opacity = String(clamp(1 - endOpacity * 1.4));

  for (const scene of scenes) {
    const local = t - scene.start;
    if (local < -0.02 || local > scene.duration + 0.02) continue;
    if (scene.id === "hook") {
      enter(document.getElementById("hook-kicker"), local, 0.0, 0.18);
      enter(document.getElementById("hook-title"), local, 0.04, 0.22);
    } else if (scene.id === "spry") {
      enter(document.getElementById("spry-kicker"), local, 0.0, 0.16);
      enter(document.getElementById("spry-title"), local, 0.05, 0.22);
    } else if (scene.id === "price") {
      enter(document.getElementById("price-kicker"), local, 0.0, 0.14);
      enter(document.getElementById("price-visit"), local, 0.04, 0.2);
      enter(document.getElementById("price-or"), local, 0.1, 0.16);
      enter(document.getElementById("price-month"), local, 0.12, 0.2);
    } else if (scene.id === "doctor") {
      enter(document.getElementById("doctor-kicker"), local, 0.0, 0.16);
      enter(document.getElementById("doctor-line"), local, 0.05, 0.18);
      enter(document.getElementById("doctor-big"), local, 0.1, 0.24);
    } else if (scene.id === "end") {
      enter(document.getElementById("end-logo"), local, 0.0, 0.16);
      enter(document.getElementById("end-word"), local, 0.04, 0.2);
      enter(document.getElementById("end-price"), local, 0.1, 0.18);
      enter(document.getElementById("end-review"), local, 0.14, 0.16);
      enter(document.getElementById("end-911"), local, 0.08, 0.18);
    }
  }
}

window.prepare = prepare;
window.renderFrame = renderFrame;
</script>
</body>
</html>
